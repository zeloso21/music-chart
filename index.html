<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>음악 차트</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f8; --card: #fff; --text: #16161a; --sub: #6b6b76;
    --line: #e4e4ea; --accent: #e5304d; --active: #fdecef;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111114; --card: #1b1b20; --text: #ececf1; --sub: #9a9aa6;
            --line: #2a2a31; --accent: #ff5470; --active: #2c1a20; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif; }
  header { padding: 16px; max-width: 1200px; margin: 0 auto;
           display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 1.4rem; }
  #updated { color: var(--sub); font-size: .85rem; }

  main { max-width: 1200px; margin: 0 auto; padding: 0 16px 32px;
         display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 900px) {
    main { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); align-items: start; }
    #stage { position: sticky; top: 16px; }
  }
  /* 휴대폰: 플레이어를 위에 고정하고 목록만 스크롤 */
  @media (max-width: 899px) {
    #stage { position: sticky; top: 0; z-index: 2; background: var(--bg);
             margin: 0 -16px; padding: 0 16px 8px; }
  }

  .video { position: relative; aspect-ratio: 16 / 9; background: #000;
           border-radius: 12px; overflow: hidden; }
  .video > * { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .placeholder { display: grid; place-items: center; color: #aaa; font-size: .95rem; }
  .now { display: flex; align-items: center; gap: 8px; margin-top: 8px; min-height: 40px; }
  .now-text { flex: 1; min-width: 0; }
  .now-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now-artist { color: var(--sub); font-size: .85rem; }
  .now button { border: 1px solid var(--line); background: var(--card); color: var(--text);
                border-radius: 999px; width: 40px; height: 40px; font-size: 1rem; cursor: pointer; }
  .now button:disabled { opacity: .4; cursor: default; }

  .tabs { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .tabs button { border: 1px solid var(--line); background: var(--card); color: var(--text);
                 border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: .9rem; }
  .tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  ol { list-style: none; margin: 0; padding: 0; background: var(--card);
       border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  li + li { border-top: 1px solid var(--line); }
  li button { display: grid; grid-template-columns: 28px 96px minmax(0, 1fr) auto;
              align-items: center; gap: 10px; width: 100%; padding: 8px 12px;
              border: 0; background: none; color: inherit; font: inherit;
              text-align: left; cursor: pointer; }
  li button:hover { background: var(--active); }
  li.playing button { background: var(--active); }
  li.playing .rank { color: var(--accent); }
  .rank { font-weight: 700; text-align: center; color: var(--sub); }
  li img { width: 96px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; display: block;
           background: var(--line); }
  .meta { min-width: 0; }
  .title { font-size: .92rem; font-weight: 600; line-height: 1.3;
           display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .artist { color: var(--sub); font-size: .8rem; margin-top: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dur { color: var(--sub); font-size: .8rem; font-variant-numeric: tabular-nums; }
  @media (max-width: 480px) {
    li button { grid-template-columns: 22px 72px minmax(0, 1fr); gap: 8px; padding: 8px; }
    li img { width: 72px; }
    .dur { display: none; }
  }
  .note { color: var(--sub); font-size: .8rem; margin: 0 0 8px; }
  .msg { padding: 24px; text-align: center; color: var(--sub); }
</style>
</head>
<body>
<header>
  <h1>🎵 음악 차트</h1>
  <span id="updated"></span>
</header>

<main>
  <section id="stage">
    <div class="video"><div id="player" class="placeholder">곡을 누르면 여기서 재생돼요</div></div>
    <div class="now">
      <button id="prev" type="button" aria-label="이전 곡" disabled>⏮</button>
      <div class="now-text">
        <div class="now-title" id="nowTitle"></div>
        <div class="now-artist" id="nowArtist"></div>
      </div>
      <button id="next" type="button" aria-label="다음 곡" disabled>⏭</button>
    </div>
  </section>

  <section>
    <div class="tabs" id="tabs" role="tablist"></div>
    <p class="note" id="note"></p>
    <ol id="list"><li class="msg">불러오는 중…</li></ol>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let charts = [];
  let chart = null;        // 지금 보고 있는 탭
  let queue = [];          // 재생 중인 목록 (탭을 바꿔도 이어서 재생)
  let index = -1;
  let player = null;
  let playerReady = false;
  let pendingId = null;

  const fmt = (sec) => {
    if (!sec) return "";
    const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = String(sec % 60).padStart(2, "0");
    return h ? `${h}:${String(m).padStart(2, "0")}:${s}` : `${m}:${s}`;
  };

  function renderTabs() {
    const tabs = $("tabs");
    tabs.replaceChildren();
    if (charts.length < 2) return;
    for (const c of charts) {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("role", "tab");
      b.textContent = c.title;
      b.setAttribute("aria-selected", c === chart);
      b.onclick = () => { chart = c; renderTabs(); renderList(); };
      tabs.append(b);
    }
  }

  function renderList() {
    const list = $("list");
    list.replaceChildren();
    $("note").textContent = chart?.note || "";
    if (!chart || !chart.items.length) {
      list.innerHTML = '<li class="msg">곡이 없어요.</li>';
      return;
    }
    chart.items.forEach((it, i) => {
      const li = document.createElement("li");
      li.dataset.videoId = it.videoId;
      const b = document.createElement("button");
      b.type = "button";
      const rank = document.createElement("span");
      rank.className = "rank";
      rank.textContent = it.rank;
      const img = document.createElement("img");
      img.src = it.thumbnail;
      img.alt = "";
      img.loading = "lazy";
      const meta = document.createElement("div");
      meta.className = "meta";
      const t = document.createElement("div");
      t.className = "title";
      t.textContent = it.title;
      const a = document.createElement("div");
      a.className = "artist";
      a.textContent = it.artist;
      meta.append(t, a);
      const d = document.createElement("span");
      d.className = "dur";
      d.textContent = fmt(it.duration);
      b.append(rank, img, meta, d);
      b.onclick = () => { queue = chart.items; play(i); };
      li.append(b);
      list.append(li);
    });
    markPlaying();
  }

  function markPlaying() {
    const id = queue[index]?.videoId;
    for (const li of $("list").children) li.classList.toggle("playing", !!id && li.dataset.videoId === id);
  }

  function play(i) {
    if (i < 0 || i >= queue.length) return;
    index = i;
    const it = queue[i];
    $("nowTitle").textContent = it.title;
    $("nowArtist").textContent = it.artist;
    $("prev").disabled = i === 0;
    $("next").disabled = i === queue.length - 1;
    markPlaying();
    if (playerReady) player.loadVideoById(it.videoId);
    else { pendingId = it.videoId; createPlayer(); }
  }

  // YouTube IFrame Player API는 첫 재생 때 불러와요.
  function createPlayer() {
    if (window.YT && YT.Player) return makePlayer();
    if (document.getElementById("yt-api")) return;
    window.onYouTubeIframeAPIReady = makePlayer;
    const s = document.createElement("script");
    s.id = "yt-api";
    s.src = "https://www.youtube.com/iframe_api";
    document.head.append(s);
  }

  function makePlayer() {
    if (player) return;
    player = new YT.Player("player", {
      videoId: pendingId,
      playerVars: { autoplay: 1, playsinline: 1, rel: 0 },
      events: {
        onReady: (e) => {
          playerReady = true;
          const id = queue[index]?.videoId;
          if (id && id !== pendingId) e.target.loadVideoById(id);
          else e.target.playVideo();
        },
        onStateChange: (e) => { if (e.data === YT.PlayerState.ENDED) play(index + 1); },
        // 재생이 막힌 영상(삭제·지역 제한 등)은 건너뛰어요.
        onError: () => setTimeout(() => play(index + 1), 1500),
      },
    });
  }

  $("prev").onclick = () => play(index - 1);
  $("next").onclick = () => play(index + 1);

  fetch("data.json", { cache: "no-cache" })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((data) => {
      charts = (data.charts || []).filter((c) => c.items);
      chart = charts[0] || null;
      if (data.updated) {
        const d = new Date(data.updated);
        $("updated").textContent = isNaN(d) ? "" :
          d.toLocaleString("ko-KR", { month: "long", day: "numeric", hour: "2-digit", minute: "2-digit" }) + " 기준";
      }
      renderTabs();
      renderList();
    })
    .catch(() => {
      $("list").innerHTML = '<li class="msg">차트 데이터를 아직 못 받았어요. 잠시 뒤 다시 와 주세요.</li>';
    });
</script>
</body>
</html>
